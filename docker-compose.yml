services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smarthouse
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d smarthouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smarthouse
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?defina DEVICE_API_KEY no .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY no .env}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://broker.hivemq.com:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-kamyla-fag/smarthouse/+/readings}
      MQTT_CONFIG_TOPIC: ${MQTT_CONFIG_TOPIC:-kamyla-fag/smarthouse/config}
      MQTT_HEATER_TOPIC: ${MQTT_HEATER_TOPIC:-kamyla-fag/smarthouse/%s/heater/set}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8080
        VITE_ADMIN_KEY: ${ADMIN_API_KEY}
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db-data:
