spring.application.name=smarthouse-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarthouse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# SmartHouse
smarthouse.default-device-id=abrigo-01
smarthouse.security.device-api-key=${DEVICE_API_KEY:}
smarthouse.security.admin-api-key=${ADMIN_API_KEY:}
smarthouse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# MQTT (leituras da ESP32)
smarthouse.mqtt.enabled=${MQTT_ENABLED:true}
smarthouse.mqtt.broker-url=${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
smarthouse.mqtt.topic=${MQTT_TOPIC:kamyla-fag/smarthouse/+/readings}
smarthouse.mqtt.config-topic=${MQTT_CONFIG_TOPIC:kamyla-fag/smarthouse/config}
smarthouse.mqtt.client-id=${MQTT_CLIENT_ID:}
smarthouse.mqtt.username=${MQTT_USERNAME:}
smarthouse.mqtt.password=${MQTT_PASSWORD:}
